services:
  evm-postgres:
    image: postgres:16
    container_name: evm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evm_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "55433:5432"
    volumes:
      - evm_postgres_data:/var/lib/postgresql/data
    networks:
      - evm-network

volumes:
  evm_postgres_data:
    name: evm_postgres_data

networks:
  evm-network:
    driver: bridge